name: Preverjanje spektrogramov

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "demo/**"
  pull_request:
    branches:
      - develop

jobs:
  check-spektrogrami:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Nastavitev Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Namestitev odvisnosti
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow

      - name: Preverjanje obstoja datoteke
        run: |
          test -f predobdelava_cnn/csv_v_spektrogram.py

      - name: Preverjanje sintakse
        run: |
          python -m py_compile predobdelava_cnn/csv_v_spektrogram.py

      - name: Osnovni test izdelave STFT spektrograma
        run: |
          python - <<'PY'
          import numpy as np
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "csv_v_spektrogram",
              "predobdelava_cnn/csv_v_spektrogram.py"
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          test_signal = np.sin(np.linspace(0, 10, 128))
          spektrogram = mod.create_stft(test_signal)

          assert spektrogram is not None
          assert spektrogram.ndim == 2
          assert spektrogram.dtype == np.uint8
          assert spektrogram.shape[0] > 0
          assert spektrogram.shape[1] > 0

          print("Preverjanje spektrogramov uspešno.")
          PY